name: CI

on:
  pull_request:

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_GITHUB_ACTIONS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  GH_REPO: ${{github.repository}}
  GH_NO_UPDATE_NOTIFIER: 1
  GH_PROMPT_DISABLED: 1

concurrency:
  group: "tests-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        runner: ["ubuntu-latest", "macos-latest"]
    name: Test - ${{matrix.runner}}
    permissions:
      pull-requests: read
    runs-on: ${{matrix.runner}}
    timeout-minutes: 90
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
            echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          fi
          brew tap tenfyzhong/tap
          brew trust tenfyzhong/tap

      - name: Checkout tap
        run: |
          cd "$(brew --repository tenfyzhong/tap)"
          git fetch origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - run: brew test-bot --only-formulae-detect --tap=tenfyzhong/tap
        id: formulae-detect

      - name: Select formula versions
        id: formula-versions
        if: steps.formulae-detect.outputs.testing_formulae != ''
        env:
          TESTING_FORMULAE: ${{ steps.formulae-detect.outputs.testing_formulae }}
        run: |
          brew info --json=v2 $TESTING_FORMULAE | ruby -rjson -e '
            formulae = JSON.parse(STDIN.read).fetch("formulae")
            stable, head = formulae.partition { |formula| formula.fetch("versions")["stable"] }
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
              output.puts "stable=#{stable.map { |formula| formula.fetch("full_name") }.join(" ")}"
              output.puts "head=#{head.map { |formula| formula.fetch("full_name") }.join(" ")}"
            end
          '

      - name: Install stable formulae
        if: steps.formula-versions.outputs.stable != ''
        env:
          FORMULAE: ${{ steps.formula-versions.outputs.stable }}
        run: brew install --build-from-source $FORMULAE

      - name: Install HEAD formulae
        if: steps.formula-versions.outputs.head != ''
        env:
          FORMULAE: ${{ steps.formula-versions.outputs.head }}
        run: brew install --HEAD $FORMULAE

      - name: Test stable formulae
        if: steps.formula-versions.outputs.stable != ''
        env:
          FORMULAE: ${{ steps.formula-versions.outputs.stable }}
        run: brew test $FORMULAE

      - name: Test HEAD formulae
        if: steps.formula-versions.outputs.head != ''
        env:
          FORMULAE: ${{ steps.formula-versions.outputs.head }}
        run: brew test --HEAD $FORMULAE

      - name: Audit formulae
        if: steps.formulae-detect.outputs.testing_formulae != ''
        env:
          FORMULAE: ${{ steps.formulae-detect.outputs.testing_formulae }}
        run: brew audit --strict $FORMULAE
